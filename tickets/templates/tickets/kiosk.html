{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Event Check-in Kiosk" %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .kiosk-container {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        .result-container {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .success-animation {
            animation: pulse 0.5s ease-in-out;
        }
        .error-animation {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        #reader {
            margin: 0 auto;
            max-width: 600px;
        }
        .welcome-message {
            font-size: 2rem;
            font-weight: bold;
            color: #28a745;
        }
        .error-message {
            font-size: 1.5rem;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="kiosk-container" id="webusb-page-root" data-print-backend="{{ event.print_backend }}" data-event-pk="{{ event.pk }}">
        <h1 class="mb-4">
            <i class="bi bi-calendar-check"></i> {% trans "Event Check-in" %}
        </h1>
        
        <!-- WebUSB printer status bar (JS shows/hides based on data-print-backend) -->
        <div id="webusb-status-bar" class="mb-2 py-1 px-2 rounded small bg-light text-start d-flex align-items-center" style="display:none!important;">
            <!-- Populated by print-manager.js -->
        </div>
        <!-- WebUSB gear panel -->
        <div id="webusb-gear-panel" class="mb-2 py-1 px-2 rounded small bg-light text-start">
            <button class="btn btn-sm btn-outline-secondary me-1" onclick="PrintManager.showPairButton()">Změnit tiskárnu</button>
            <button class="btn btn-sm btn-outline-danger" onclick="WebUSBBackend.clearPairedInfo(document.getElementById('printer_queue').value); PrintManager.setStatus('unpaired', '')">Odpárovat</button>
        </div>
        <div class="card shadow-lg">
            <div class="card-body p-5">
                <h3 class="mb-4">{% trans "Please scan your ticket QR code" %}</h3>
                
                <!-- Printer selection (hidden, can be set via URL parameter) -->
                <input type="hidden" id="printer_queue" value="{{ printer_queue }}">
                
                <!-- Result display -->
                <div id="result" class="result-container mb-4">
                    <div class="text-muted">
                        <i class="bi bi-qr-code-scan" style="font-size: 3rem;"></i>
                        <p class="mt-3">{% trans "Ready to scan..." %}</p>
                    </div>
                </div>
                
                <!-- QR Scanner -->
                <div id="reader"></div>
                
                <div class="mt-4 text-muted">
                    <small>{% trans "Having trouble? Please ask our staff for assistance." %}</small>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/print-manager.js' %}"></script>
    <script src="{% static 'js/webusb-backend.js' %}"></script>
    <script src="{% static 'js/html5-qrcode.min.js' %}"></script>
    <script>
        // Translations
        const translations = {
            welcome: "{% trans 'Welcome!' %}",
            badgeBeingPrinted: "{% trans 'Badge is being printed' %}",
            readyToScan: "{% trans 'Ready to scan...' %}"
        };
        
        // Sound feedback
        const successSound = new Audio('data:audio/wav;base64,UklGRqwCAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQgCAACA/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/gP+A/4D/');
        const errorSound = new Audio('data:audio/wav;base64,UklGRqwCAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQgCAAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA');
        
        let html5QrcodeScanner;
        let isProcessing = false;
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        const csrftoken = getCookie('csrftoken');
        
        function verifyTicket(qrCode) {
            if (isProcessing) return;
            isProcessing = true;
            
            fetch('{% url "tickets:kiosk_verify" event_pk=active_event.pk %}', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken,
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'qr_code': qrCode,
                    'printer_queue': document.getElementById('printer_queue').value
                })
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                // Delegate client-side printing to PrintManager
                if (data.print_backend && window.PrintManager) {
                    PrintManager.handle(data);
                }

                if (data.success) {
                    successSound.play().catch(e => console.log('Sound failed'));
                    resultDiv.innerHTML = `
                        <div class="success-animation">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                            <div class="welcome-message mt-3">${data.welcome_message || translations.welcome}</div>
                            ${data.ticket ? `
                                <p class="mt-2 fs-5">${data.ticket.name}</p>
                                ${data.ticket.company ? `<p class="text-muted">${data.ticket.company}</p>` : ''}
                            ` : ''}
                            ${data.badge_printed ? `
                                <div class="alert alert-success mt-3">
                                    <i class="bi bi-printer"></i> ${data.print_message || translations.badgeBeingPrinted}
                                </div>
                            ` : data.print_warning ? `
                                <div class="alert alert-warning mt-3">
                                    <i class="bi bi-exclamation-triangle"></i> ${data.print_warning}
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else {
                    errorSound.play().catch(e => console.log('Sound failed'));
                    resultDiv.innerHTML = `
                        <div class="error-animation">
                            <i class="bi bi-x-circle-fill text-danger" style="font-size: 5rem;"></i>
                            <div class="error-message mt-3">${data.message}</div>
                            <p class="mt-3 text-muted">{% trans "Please see our staff for assistance" %}</p>
                        </div>
                    `;
                }
                
                // Reset after 5 seconds
                setTimeout(() => {
                    resultDiv.innerHTML = `
                        <div class="text-muted">
                            <i class="bi bi-qr-code-scan" style="font-size: 3rem;"></i>
                            <p class="mt-3">${translations.readyToScan}</p>
                        </div>
                    `;
                    isProcessing = false;
                    if (html5QrcodeScanner) {
                        html5QrcodeScanner.resume();
                    }
                }, 5000);
            })
            .catch(error => {
                isProcessing = false;
                console.error('Error:', error);
            });
        }
        
        function initializeScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            };
            
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    if (!isProcessing) {
                        html5QrcodeScanner.pause();
                        verifyTicket(decodedText);
                    }
                },
                (error) => {
                    // Ignore scan errors
                }
            ).catch(err => {
                console.error("Failed to start scanner:", err);
                document.getElementById('result').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> {% trans "Camera access denied." %} 
                        {% trans "Please allow camera access and refresh the page." %}
                    </div>
                `;
            });
        }
        
        // Start scanner when page loads
        document.addEventListener('DOMContentLoaded', initializeScanner);
        
        // Prevent right-click (basic protection)
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // Auto-refresh page every hour to prevent memory issues
        setTimeout(() => {
            window.location.reload();
        }, 3600000);
    </script>
</body>
</html>
