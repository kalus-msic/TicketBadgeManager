{% extends 'base.html' %}
{% load static i18n %}
{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">{% trans "Scan Ticket" %}</h2>
                    <!-- Přidaná informace o čísle skeneru -->
                    <p class="mb-0 mt-2 text-muted">{% trans "Active Scanner" %}: #{{ printer_queue }}</p>
                </div>
                <div class="card-body">
                    <!-- Skrytý input pro printer_queue -->
                    <input type="hidden" id="printer_queue" value="{{ printer_queue }}">
                    <!-- Skrytý input pro auto_print_on_scan -->
                    <input type="hidden" id="auto_print_on_scan" value="{{ auto_print_on_scan|yesno:'true,false' }}">
                    
                    <!-- Quick search -->
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="quickSearch" 
                                   placeholder="{% trans 'Search VALID tickets by name and press Enter (or use scanner below)' %}">
                            <button class="btn btn-primary" type="button" id="searchBtn">
                                <i class="bi bi-search"></i> {% trans "Search" %}
                            </button>
                        </div>
                        <div id="searchResults" class="mt-2"></div>
                    </div>
                    
                    <!-- Výsledky se zobrazí zde -->
                    <div id="result"></div>
                    <!-- Skener se zobrazí jen pokud není QR kód v URL parametrech -->
                    <div id="reader" class="mb-4" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/html5-qrcode.min.js' %}"></script>

const errorSound = new Audio('data:audio/wav;base64,UklGRqwCAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQgCAAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA//8AAP//AAD//wAA');

// Function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrftoken = getCookie('csrftoken');

function updateGDPR(choice) {
    fetch('{% url "tickets:verify_ticket" %}', {
        method: 'POST',
        body: new URLSearchParams({
            'qr_code': currentQrCode,
            'gdpr_action': choice,
            'printer_queue': document.getElementById('printer_queue').value
        })
    })
    .then(response => response.json())
    .then(data => {
        const gdprButtons = document.getElementById('gdpr-buttons');
        if (gdprButtons) {
            gdprButtons.innerHTML = `<div class="alert alert-success">GDPR preference updated: ${data.gdpr_status}</div>`;
        }
    });
}

function verifyTicket(qrCode, printBadge = false) {
    currentQrCode = qrCode;

    fetch('{% url "tickets:verify_ticket" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': csrftoken,
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: new URLSearchParams({
            'qr_code': qrCode,
            'print': printBadge ? 'true' : 'false',
            'printer_queue': document.getElementById('printer_queue').value
        })
    })
    .then(response => response.json())
    .then(data => {
        const resultDiv = document.getElementById('result');
        
        // Show print warning if exists
        if (data.print_warning) {
            resultDiv.innerHTML = `
                <div class="alert alert-warning alert-dismissible fade show mb-3">
                    <i class="bi bi-exclamation-triangle"></i> ${data.print_warning}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        } else {
            resultDiv.innerHTML = '';
        }
        
        if (data.success) {
            // Play success sound
            successSound.play().catch(e => console.log('Sound play failed:', e));
            
            resultDiv.innerHTML += `
                <div class="alert alert-success">
                    <h4 class="alert-heading">${data.message}</h4>
                    ${data.ticket ? `
                        <p class="mb-0">Name: ${data.ticket.name}</p>
                        <p class="mb-0">Company: ${data.ticket.company}</p>
                        <p class="mb-0">Status: ${data.ticket.status}</p>
                    ` : ''}
                </div>
            `;
            
        } else {
            // Play error sound
            errorSound.play().catch(e => console.log('Sound play failed:', e));
            
            resultDiv.innerHTML += `
                <div class="alert alert-danger">
                    <h4 class="alert-heading">${data.message}</h4>
                    ${data.ticket ? `
                        <p class="mb-0">Name: ${data.ticket.name}</p>
                        <p class="mb-0">Company: ${data.ticket.company}</p>
                    ` : ''}
                </div>
            `;
        }
        
        // Add navigation buttons
        resultDiv.innerHTML += `
            <div class="d-grid gap-2">
                <div class="row mt-3">
                    <div class="col-6">
                        <a href="{% url 'tickets:ticket_list' %}" class="btn btn-secondary w-100">
                            Back to Tickets
                        </a>
                    </div>
                    <div class="col-6">
                        ${data.ticket && (data.ticket.id || data.ticket.qr_code) ? `
                            <a href="${data.ticket.id ? `/tickets/${data.ticket.id}/` : `/tickets/detail/?qr_code=${encodeURIComponent(data.ticket.qr_code)}`}" class="btn btn-primary w-100">
                                View Ticket details
                            </a>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    })
    .catch(error => {
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `
            <div class="alert alert-danger">
                <h4 class="alert-heading">Connection Error</h4>
                <p>${error.message}</p>
            </div>
        `;
    });
}

let html5QrcodeScanner; // Globální proměnná pro skener
let scannedCodes = new Set(); // Sada pro ukládání již naskenovaných QR kódů

// Zbytek vašeho původního JavaScript kódu zůstává stejný...
function getOptimalQrboxSize() {
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const minDimension = Math.min(viewportWidth, viewportHeight);
    return Math.floor(minDimension * 0.5);
}

function checkForQrCodeInUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const qrCodeFromUrl = urlParams.get('qr_code');
    // Získáme printer_queue z URL nebo použijeme hodnotu z hidden inputu
    const printerQueue = urlParams.get('printer_queue') || document.getElementById('printer_queue').value;

    // Pokud je v URL QR kód, nastavíme hodnotu printer_queue do hidden inputu
    if (qrCodeFromUrl) {
        document.getElementById('printer_queue').value = printerQueue;
        // When coming from "Verify & Print" button, print should be true
        const shouldPrint = true;
        verifyTicket(qrCodeFromUrl, shouldPrint);
    } else {
        initializeScanner();
    }
}

function initializeScanner() {
    const readerElement = document.getElementById('reader');
    readerElement.style.display = 'block';

    const optimalQrboxSize = getOptimalQrboxSize();

    html5QrcodeScanner = new Html5Qrcode("reader");
    html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: optimalQrboxSize },
        onScanSuccess,
        onScanError
    ).catch(err => {
        console.error("Error starting scanner:", err);
    });
}

function onScanSuccess(decodedText, decodedResult) {
    console.log("QR Code detected:", decodedText);

    if (scannedCodes.has(decodedText)) {
        console.log("Duplicate QR code ignored.");
        return;
    }

    scannedCodes.add(decodedText);
    // Use auto print setting
    const autoPrint = document.getElementById('auto_print_on_scan').value === 'true';
    verifyTicket(decodedText, autoPrint);

    html5QrcodeScanner.pause();
    setTimeout(() => {
        html5QrcodeScanner.resume();
    }, 2000);
}

function onScanError(errorMessage) {
    console.error("QR Code scan error:", errorMessage);
}

checkForQrCodeInUrl();

// Quick search functionality
const searchInput = document.getElementById('quickSearch');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');

function performSearch() {
    const query = searchInput.value.trim();
    if (query.length < 2) {
        searchResults.innerHTML = '';
        return;
    }
    
    fetch(`{% url 'tickets:search_tickets' %}?q=${encodeURIComponent(query)}`, {
        headers: {
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(response => response.json())
    .then(data => {
        searchResults.innerHTML = '';
        
        if (data.results.length === 0) {
            searchResults.innerHTML = '<div class="alert alert-info">{% trans "No tickets found" %}</div>';
            return;
        }
        
        const resultsList = document.createElement('div');
        resultsList.className = 'list-group';
        
        data.results.forEach(ticket => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action';
            item.innerHTML = `
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>${ticket.name}</strong>
                        ${ticket.company_name ? `<br><small class="text-muted">${ticket.company_name}</small>` : ''}
                    </div>
                    <span class="badge bg-primary">{% trans "Verify & Print" %}</span>
                </div>
            `;
            item.addEventListener('click', () => {
                searchResults.innerHTML = '';
                searchInput.value = '';
                verifyTicket(ticket.qr_code, true);  // Print when selected from search
            });
            resultsList.appendChild(item);
        });
        
        searchResults.appendChild(resultsList);
    })
    .catch(error => {
        searchResults.innerHTML = '<div class="alert alert-danger">{% trans "Search error" %}</div>';
    });
}

searchBtn.addEventListener('click', performSearch);
searchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
    }
});

// Focus on search input when page loads
searchInput.focus();
</script>
{% endblock %}
